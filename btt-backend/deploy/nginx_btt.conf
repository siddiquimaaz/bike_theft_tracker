# /etc/nginx/sites-available/btt
# Bike Theft Tracker — Nginx reverse proxy config
# Serves React /dist/ as static files, proxies /api/ to Gunicorn on port 8000

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect all HTTP → HTTPS permanently
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "DENY"              always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
        always;

    # ── React SPA (static files) ──────────────────────────────────────────────
    root /var/www/html/btt;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback — React Router handles routing
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — generous for ML endpoint calls
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Media files (bike photos, evidence) ───────────────────────────────────
    # Served directly by Nginx — Django does NOT handle media downloads
    location /media/ {
        alias /var/www/btt/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Block direct directory listing
        autoindex off;

        # Only serve JPEG and PNG (matches upload validation)
        location ~* \.(jpg|jpeg|png)$ {
            expires 30d;
        }
        # Deny everything else
        location ~* \. {
            deny all;
        }
    }

    # ── Django static files (admin CSS/JS) ────────────────────────────────────
    location /static/ {
        alias /var/www/btt/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Rate limiting for login endpoint ──────────────────────────────────────
    # Application-level rate limiting via django-ratelimit handles most cases.
    # Nginx limit_req adds a network-layer defence.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    location /api/auth/login/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Block common attack patterns ──────────────────────────────────────────
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        return 404;
    }

    # Max upload size — matches MAX_UPLOAD_SIZE_MB * 5 (for evidence multi-upload)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/btt_access.log;
    error_log  /var/log/nginx/btt_error.log warn;
}
