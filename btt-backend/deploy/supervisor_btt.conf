# /etc/supervisor/conf.d/btt.conf
# Bike Theft Tracker — Supervisor manages Gunicorn
# Auto-restarts on crash, starts on server boot

[program:btt]
; workers=1 required until Celery replaces daemon-thread notification dispatch
; multi-worker breaks exactly-once notification guarantee
command=gunicorn config.wsgi:application --workers 1 --bind 127.0.0.1:8000
    --worker-class sync
    --timeout 120
    --log-level info
    --access-logfile /var/log/btt/gunicorn_access.log
    --error-logfile  /var/log/btt/gunicorn_error.log

directory=/var/www/btt/backend
user=www-data
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=10

stderr_logfile=/var/log/btt/supervisor_err.log
stdout_logfile=/var/log/btt/supervisor_out.log

environment=
    DJANGO_SETTINGS_MODULE="config.settings",
    PYTHONPATH="/var/www/btt/backend"
